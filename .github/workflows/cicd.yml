name: CI/CD Pipeline with Security Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    env:
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"

      - name: Install dependencies
        run: "pip install --only-binary :all: --require-hashes -r requirements.txt"

      - name: Run tests with coverage
        run: pytest wallet/tests/ -v --tb=short --cov=wallet --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: Backend/coverage.xml

  trivy:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy (security gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          format: table

      - name: Run Trivy (SARIF for Security tab)
        uses: aquasecurity/trivy-action@v0.36.0
        if: always()
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif

      - name: Upload to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  bandit:
    name: Python Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"

      - name: Install and run Bandit
        run: |
          pip install --only-binary :all: bandit[toml]
          bandit -r Backend/ \
            -x Backend/wallet/tests,Backend/.venv \
            -ll \
            -ii \
            -f json \
            -o bandit-report.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-security-report
          path: bandit-report.json

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: Frontend/coverage/lcov.info

  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: [test, frontend-tests]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: Backend/

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: Frontend/coverage/

      - uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [test, trivy, bandit, frontend-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          push: true
          tags: |
            ghcr.io/vbabino/digital-identity-wallet-backend:latest
            ghcr.io/vbabino/digital-identity-wallet-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend
          push: true
          build-args: |
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
            VITE_GOOGLE_REDIRECT_URI=${{ secrets.VITE_GOOGLE_REDIRECT_URI }}
          tags: |
            ghcr.io/vbabino/digital-identity-wallet-frontend:latest
            ghcr.io/vbabino/digital-identity-wallet-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build & push client
        uses: docker/build-push-action@v6
        with:
          context: ./Client
          push: true
          tags: |
            ghcr.io/vbabino/digital-identity-wallet-client:latest
            ghcr.io/vbabino/digital-identity-wallet-client:${{ github.sha }}
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy over SSH
        id: deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          NEW_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: GHCR_TOKEN,GHCR_ACTOR,NEW_SHA
          script: |
            set -e
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
            cd "${{ secrets.DEPLOY_PATH }}"
            git pull origin main

            export IMAGE_TAG="$NEW_SHA"
            docker compose --env-file .env.production pull
            docker compose --env-file .env.production up -d --remove-orphans

            # Containers reporting "Started" doesn't mean the app inside is
            # ready yet — docker_entrypoint.py runs `migrate` before gunicorn
            # binds, so a fixed short sleep can race a cold start. Poll
            # instead of guessing a delay.
            # This host runs many other containers under real memory
            # pressure (swap in active use) — docker-proxy/iptables setup
            # for a just-recreated container's port mapping can lag well
            # behind the app itself being ready, so the window here is
            # generous on purpose rather than a guess at app boot time.
            wait_healthy() {
              local url="$1" name="$2" attempt=0
              until curl -fsS --max-time 5 "$url" > /dev/null 2>&1; do
                attempt=$((attempt + 1))
                if [ "$attempt" -ge 60 ]; then
                  echo "::error::$name did not become healthy within 3m"
                  return 1
                fi
                sleep 3
              done
              echo "$name healthy"
            }
            wait_healthy http://127.0.0.1:8000/api/schema/ Backend
            wait_healthy http://127.0.0.1:3000/ Frontend
            echo "Backend and frontend healthy on $NEW_SHA"

            # Only recorded once health checks pass — the rollback step below
            # reads this to know the last SHA that was actually verified
            # working, which may lag behind $NEW_SHA by one or more failed
            # deploys.
            echo "$NEW_SHA" > ~/.digital-identity-wallet-last-good-sha

            # Safe to prune now: the marker above already points at the
            # image(s) currently running, so nothing prune removes here is
            # still needed for a rollback.
            docker image prune -af --filter "until=72h"

      - name: Roll back to last known-good deployment
        if: failure()
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: GHCR_TOKEN,GHCR_ACTOR
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"

            if [ ! -f ~/.digital-identity-wallet-last-good-sha ]; then
              echo "::error::No previous successful deployment recorded — nothing to roll back to. Manual intervention required."
              exit 1
            fi

            LAST_GOOD_SHA="$(cat ~/.digital-identity-wallet-last-good-sha)"
            echo "Deploy failed — rolling back to last known-good SHA: $LAST_GOOD_SHA"

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin

            export IMAGE_TAG="$LAST_GOOD_SHA"
            docker compose --env-file .env.production pull
            docker compose --env-file .env.production up -d --remove-orphans

            wait_healthy() {
              local url="$1" name="$2" attempt=0
              until curl -fsS --max-time 5 "$url" > /dev/null 2>&1; do
                attempt=$((attempt + 1))
                if [ "$attempt" -ge 60 ]; then
                  echo "::error::$name did not become healthy within 3m during rollback"
                  return 1
                fi
                sleep 3
              done
              echo "$name healthy"
            }
            wait_healthy http://127.0.0.1:8000/api/schema/ Backend
            wait_healthy http://127.0.0.1:3000/ Frontend
            echo "::error::Deploy of ${{ github.sha }} failed and was rolled back — service restored on $LAST_GOOD_SHA"
