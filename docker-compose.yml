services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: walletuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal]

  backend:
    image: ghcr.io/vbabino/digital-identity-wallet-backend:${IMAGE_TAG:-latest}
    build:
      context: ./Backend
    restart: unless-stopped
    env_file: ./Backend/.env.production
    depends_on: [postgres]
    ports:
      - "127.0.0.1:8000:8000"
    networks: [internal]

  frontend:
    image: ghcr.io/vbabino/digital-identity-wallet-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./Frontend
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
        VITE_GOOGLE_REDIRECT_URI: ${VITE_GOOGLE_REDIRECT_URI}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    networks: [internal]

  client:
    image: ghcr.io/vbabino/digital-identity-wallet-client:${IMAGE_TAG:-latest}
    build:
      context: ./Client
    restart: unless-stopped
    env_file: ./Client/.env.production
    environment:
      SQLITE_DATA_DIR: /app/data
    volumes:
      - client_sqlite:/app/data
    ports:
      - "127.0.0.1:8001:8001"
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  client_sqlite:
