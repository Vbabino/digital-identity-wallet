sonar.projectKey=Vbabino_digital-identity-wallet
sonar.projectName=TrustVault
sonar.organization=vbabino
sonar.sourceEncoding=UTF-8

# Analyse backend and frontend; exclude the client simulator (separate project)
sonar.sources=Backend,Frontend/app
sonar.tests=Backend/wallet/tests

sonar.exclusions=\
  Backend/.venv/**,\
  Backend/config/**,\
  Backend/docker_entrypoint.py,\
  Backend/manage.py,\
  Backend/wallet/migrations/**,\
  Backend/wallet/tests/**,\
  Backend/db.sqlite3,\
  Frontend/node_modules/**,\
  Frontend/.react-router/**,\
  Frontend/build/**,\
  Frontend/app/**/*.test.ts,\
  Frontend/app/**/*.test.tsx,\
  Frontend/app/routes/privacy.tsx,\
  Frontend/app/test/**

sonar.test.inclusions=Backend/wallet/tests/**,Frontend/app/**/*.test.ts,Frontend/app/**/*.test.tsx,Frontend/app/test/**

# Python
sonar.python.version=3.12.4
sonar.python.coverage.reportPaths=Backend/coverage.xml

# TypeScript / React
sonar.javascript.lcov.reportPaths=Frontend/coverage/lcov.info
