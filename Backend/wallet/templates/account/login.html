{% extends "base.html" %}
{% load socialaccount %}
{% block content %}

<h2>Sign in to My Digital ID</h2>

{% if form.errors %}
  <p style="color:red;">{{ form.non_field_errors }}</p>
{% endif %}

<form method="post" action="{% url 'account_login' %}">
  {% csrf_token %}
  {{ form.as_p }}
  <input type="hidden" name="next" value="{{ redirect_field_value }}" />
  <button type="submit">Sign in</button>
</form>

<hr />

<p>
  <a href="{% provider_login_url 'google' next=redirect_field_value %}">Sign in with Google</a>
</p>

{% endblock %}
